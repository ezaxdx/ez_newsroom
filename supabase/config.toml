
[functions.curate]
enabled = true
verify_jwt = false
import_map = "./functions/curate/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/curate/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/curate/*.html" ]

[functions.audit-content]
enabled = true
verify_jwt = false
import_map = "./functions/audit-content/deno.json"
entrypoint = "./functions/audit-content/index.ts"
